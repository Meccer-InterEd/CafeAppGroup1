<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cart</title>
    <link rel="stylesheet" href="cart.css"/>
</head>
<body>
<main class="primaryContent">
    <div class="titleSection">
        <div class="titleSectionComponents">
            <p>
                Cart
            </p>
        </div>
        <a href="">
            <img id="chervron_back" src="./_Icons/chevron-back-outline.svg" alt="chevron-back-outline" />
        </a>
    </div>
    <div class="cartItems">
        <div class="Item" id="cardOne">
            <div class="details">
                <img src="./_Images/Dalgona_Macha.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Dalgona Matcha</p>
                    <p class="costPrice">R <span class="price">299</span></p>
                </div>
            </div>
            <div class="quantities">
                <button id="decrementCardOne" class="decrement">
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </button>
                <button id="quantityCardOne" class="quantity">
                    1
                </button>
                <button id="incrementCardOne" class="increment">
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </button>
            </div>
            <div id="deleteCardOne" class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
        <div class="Item" id="cardTwo">
            <div class="details">
                <img src="./_Images/Bursting_Blueberry_Coffee.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Bursting Blueberry</p>
                    <p class="costPrice">R <span class="price">249</span></p>
                </div>
            </div>
            <div class="quantities">
                <button id="decrementCardTwo" class="decrement">
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </button>
                <button id="quantityCardTwo" class="quantity">
                    2
                </button>
                <button id="incrementCardTwo" class="increment">
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </button>
            </div>
            <div id="deleteCardTwo" class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
        <div class="Item" id="cardThree">
            <div class="details">
                <img src="./_Images/Cinnamon_Cappuccino.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Cinnamon & Cocoa</p>
                    <p class="costPrice">R <span class="price">99</span></p>
                </div>
            </div>
            <div class="quantities">
                <button id="decrementCardThree" class="decrement">
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </button>
                <button id="quantityCardThree" class="quantity">
                    1
                </button>
                <button id="incrementCardThree" class="increment">
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </button>
            </div>
            <div id="deleteCardThree" class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
    </div>
</main>
<script src="./cart.js" type="text/javascript"></script>
</body>
</html>
