<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cart</title>
    <link rel="stylesheet" href="cart.css"/>
</head>
<body>
<main class="primaryContent">
    <div class="titleSection">
        <div class="titleSectionComponents">
            <p>
                Cart
            </p>
        </div>
        <a href="">
            <img id="chervron_back" src="./_Icons/chevron-back-outline.svg" alt="chevron-back-outline" />
        </a>
    </div>
    <div class="cartItems">
        <div class="Item">
            <div class="details">
                <img src="./_Images/Dalgona_Macha.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Dalgona Matcha</p>
                    <p class="costPrice">R 299</p>
                </div>
            </div>
            <div class="quantities">
                <p>
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </p>
                <p class="quantity">
                    <span>1</span>
                </p>
                <p>
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </p>
            </div>
            <div class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
        <div class="Item">
            <div class="details">
                <img src="./_Images/Bursting_Blueberry_Coffee.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Bursting Blueberry</p>
                    <p class="costPrice">R 249</p>
                </div>
            </div>
            <div class="quantities">
                <p>
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </p>
                <p class="quantity">
                    <span>2</span>
                </p>
                <p>
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </p>
            </div>
            <div class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
        <div class="Item">
            <div class="details">
                <img src="./_Images/Cinnamon_Cappuccino.jpg" alt="Dalgona Matcha" />
                <div class="detailsText">
                    <p>Cappuccino</p>
                    <p>Cinnamon & Cocoa</p>
                    <p class="costPrice">R 99</p>
                </div>
            </div>
            <div class="quantities">
                <p>
                    <img src="./_Icons/remove.svg" alt="MinusIcon" />
                </p>
                <p class="quantity">
                    <span>1</span>
                </p>
                <p>
                    <img src="./_Icons/add.svg" alt="AddIcon" />
                </p>
            </div>
            <div class="delete">
                <img src="./_Icons/trash-outline.svg" alt="DeleteIcon" />
            </div>
        </div>
    </div>
</main>
</body>
</html>
