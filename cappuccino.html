<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="cappuccino.css" />
    <title>HomePage</title>
  </head>
  <body>
    <div>
      <img
        class="Arrow"
        src="_Icons/Group%20109.svg"
        width="10%"
        height="10%"
        alt="Arrow Icon"
      />
    </div>
    <div>
      <img
        class="CappacinoPic"
        src="./_Images/Cappuccino.jpg"
        width="100%"
        height="15%"
        alt="coffe img"
      />
    </div>
    <div class="first">
      <div><h1>Cappuccino</h1></div>
      <div>
        <img
          src="_Icons/heart-outline.svg"
          width="20%"
          height="20%"
          alt="heart icon"
        />
      </div>
    </div>
    <div class="second">
      <div id="Text1">Drizzled with Caramel</div>
      <div class="Rating">
          <div id="star"> <img
            src="_Icons/star-outline.svg"
            width="35%"
            height="35%"
            alt="Rating star"
          />
      </div>
        <div id="heading5">4.5</div>
      </div>
    </div>
    <div>
      <p id="FirstText">
        A single espresso shot poured into hot foamy milk, with the surface
        topped with mildly sweetened cocoa powder and drizzled with scrumptious
        caramel syrup.
      </p>
    </div>
    <div>Choice of Milk</div>
    <div class="Bts">
      <button id="OatMilk">Oat Milk</button>
      <button>Soy Milk</button>
      <button>Almond Milk</button>
    </div>
    <div class="Purchase">
        <div class="tag">
        <div>Price</div>
        <div>R 249</div>
      </div>
      <div><button id="buyNow">BUY NOW</button></div>
    </div>

    <script src="./cappuccino.js" type="text/javascript"></script>
  </body>
</html>
